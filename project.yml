name: SmartParking
options:
  bundleIdPrefix: com.andresmorales
  deploymentTarget:
    iOS: "17.0"
targets:
  SmartParking:
    type: application
    platform: iOS
    sources:
      - path: SmartParking
    info:
      path: SmartParking/Info.plist
      properties:
        UILaunchScreen: {}
        APIBaseURL: $(API_BASE_URL)
        NSLocationWhenInUseUsageDescription: Parkwise uses your location to remember where you parked and guide you back to your car.
        NSMicrophoneUsageDescription: ParkWise uses the microphone to search for a parking spot by voice.
        NSCameraUsageDescription: ParkWise uses the camera to add a photo to a report about a parking spot.
        NSSpeechRecognitionUsageDescription: ParkWise turns what you say into a search for a parking spot.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andresmorales.SmartParking
        API_BASE_URL: https://parkwise-api-a1f0.onrender.com
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - SmartParkingTests
  SmartParkingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SmartParkingTests
    dependencies:
      - target: SmartParking
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andresmorales.SmartParkingTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  SmartParking:
    build:
      targets:
        SmartParking: all
    test:
      config: Debug
      targets:
        - SmartParkingTests
    run:
      config: Debug
    archive:
      config: Release
